<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabletop Map — Player Display</title><style>html,body{margin:0;overflow:hidden;background:#000;width:100%;height:100%}canvas{display:block;background:#000}#start{position:fixed;bottom:10px;left:10px;z-index:5;background:#111c;color:#ddd;border:1px solid #555;border-radius:8px;padding:8px;font:14px system-ui;cursor:pointer}#soundToggle{position:fixed;bottom:10px;right:10px;z-index:5;border:1px solid #555;border-radius:8px;padding:8px;background:#111c;color:#bbb;cursor:pointer}#sharedRolls{position:fixed;top:16px;right:16px;display:grid;gap:8px;max-width:360px;pointer-events:none;font:14px system-ui;color:#eee;z-index:4}.shared-roll{background:#111e;border:1px solid #99804c;border-radius:12px;padding:14px;display:grid;gap:5px;animation:arrive .25s ease-out}.shared-roll strong{font-size:36px;color:#ffd588}.shared-roll small{color:#aaa}@keyframes arrive{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.shared-roll{animation:none}}#playerInvite{position:fixed;inset:0;z-index:6;background:#000e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:clamp(12px,2.5vmin,24px) system-ui;pointer-events:none}#playerInvite[hidden]{display:none}#playerInvite h2{margin:0 12px 12px}#playerInvite p{margin:12px}#playerInvite img{width:min(calc(var(--qr-height,100vh)*.65),calc(var(--qr-width,100vw)*.8),540px);height:min(calc(var(--qr-height,100vh)*.65),calc(var(--qr-width,100vw)*.8),540px);background:#fff;image-rendering:pixelated}#playerInvite{background:transparent;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;align-content:center;box-sizing:border-box}#playerInvite .invite-tile{background:#111f;border:1px solid #777;border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden}#playerInvite h2{font-size:16px;margin:0 0 8px;max-width:240px;overflow-wrap:anywhere}#playerInvite p{font-size:12px;margin:6px 0 0}#playerInvite img{width:min(240px,calc(var(--qr-width,100vw)*.3),calc((var(--qr-height,100vh) - 24px)/var(--rows) - 90px));height:auto;aspect-ratio:1}#playerInvite.sides{align-content:stretch;justify-content:stretch;grid-template-columns:repeat(var(--columns),minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}#playerInvite.sides img{width:min(240px,calc((var(--qr-width,100vw) - 12px * (var(--columns) + 1))/var(--columns) - 24px),calc(var(--qr-height,100vh)/2 - 100px))}#playerInvite.sides .invite-tile{max-width:100%;box-sizing:border-box}#playerInvite.sides .invite-tile h2{max-width:100%}#playerInvite.sides .invite-tile:nth-child(odd){justify-self:start}#playerInvite.sides .invite-tile:nth-child(even){justify-self:end}#playerInvite.center{background:#000b}#playerInvite.center.single{grid-template-columns:1fr}#playerInvite.center.single img{width:min(calc(var(--qr-height,100vh)*.65),calc(var(--qr-width,100vw)*.8),540px)}#playerInvite.center.single h2{font-size:24px}#desktopExit{position:fixed;left:10px;bottom:10px;z-index:7;background:#111c;color:#ddd;border:1px solid #555;border-radius:8px;padding:8px;font:14px system-ui;cursor:pointer}</style></head><body><canvas id="display"></canvas><button id="start">Fullscreen · one monitor</button><button id="soundToggle">Enable sound</button><script type="module" src="/table.js"></script></body></html>
